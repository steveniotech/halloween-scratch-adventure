<!doctype html><html lang="en"><meta charset="utf-8"><title>Local browser layout QA</title><h1>Real-browser layout QA</h1><p>Tests the actual site in a 375px iframe. Preview uses memory only.</p><pre id="results">Loading…</pre><iframe title="Actual site at mobile width" width="375" height="700" src="../halloween-scratch-adventure/index.html"></iframe><script>
const frame=document.querySelector('iframe');frame.onload=async()=>{const w=frame.contentWindow,d=w.document,A=w.HalloweenApp,out=[];const measure=label=>out.push(label+': viewport '+w.innerWidth+', document '+d.documentElement.scrollWidth+' — '+(d.documentElement.scrollWidth<=w.innerWidth?'PASS':'OVERFLOW'));A.showHome();measure('Home');for(const id of ['beginner-ready','beginner-gate']){A.preview(id);d.querySelector('[data-section="3"]').click();for(const e of d.querySelectorAll('details'))e.open=true;measure(id+' Build and final overview');}A.showHome();
// Capture the browser-created export Blob; suppress the actual download to keep all files inside the project.
let blob;const create=w.URL.createObjectURL,make=d.createElement.bind(d);w.URL.createObjectURL=value=>{blob=value;return create.call(w.URL,value);};d.createElement=(name,...args)=>{const e=make(name,...args);if(name==='a')e.click=()=>{};return e;};A.exportData();d.createElement=make;w.URL.createObjectURL=create;const exported=JSON.parse(await blob.text());out.push('Browser export Blob JSON: '+(exported.courses.length===2&&exported.courses[0].questionIds.length===24&&exported.courses[1].questionIds.length===32?'PASS':'FAIL')+' (download suppressed)');document.getElementById('results').textContent=out.join('\n');};
</script></html>
